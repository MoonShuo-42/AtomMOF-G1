defaults:
  - condition_encoder@condition_encoder: static
  - geometry@geometry: periodic
  - _self_

_target_: src.models.g1new.G1NewModule
h_dim: 256
width: 64
hidden_dim: 128
rounds: 2
edge_chunk_size: 65536
# Runtime-only G1-New implementation; learned tensors and formulas are unchanged.
optimized: true
# Only the new edge MLP activations are recomputed; backbone precision unchanged.
activation_checkpointing: true
# Independent candidates; false retains the previously validated execution path.
# Enable only with optimized=true. Keep them explicit in numerical/performance A/Bs.
inplace_edge_sum: false
checkpoint_relation_inputs: false
stream_edge_pooling: false
