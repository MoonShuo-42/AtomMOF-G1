# @package _global_
# Run with execution=optimized and pretrained_ckpt_path=<stage1 K32 checkpoint>.
defaults:
  - g1_small_stage1
  - _self_

task_name: train_bwdb_g1_small_stage2_opt-final_k64_every3_b32_a2_200epoch
tags: [bwdb, g1, small, stage2, k64, every3, zero_init]
pretrained_g1_expand_groups: true
pretrained_g1_expand_bridges: true
resume_ckpt_path: null

trainer:
  max_epochs: 200

data:
  max_num_atoms: 300

model:
  flow_model_args:
    g1:
      insert_after: [3, 6, 9, 12, 15, 18, 21, 24]
      module:
        router:
          max_groups: 64

callbacks:
  model_checkpoint:
    monitor: null
    save_top_k: -1
    save_last: true
    save_weights_only: false
    every_n_epochs: 100
    every_n_train_steps: null
    train_time_interval: null
    save_on_train_epoch_end: true
    auto_insert_metric_name: false
    filename: epoch_{epoch}-step_{step}
