# @package _global_
defaults:
  - override /data: bwdb
  - override /model: g1new
  - override /trainer: ddp

task_name: train_bwdb_g1new_small_stage1
tags: [bwdb, g1new, small, stage1]
seed: 42
pretrained_ckpt_path: null
resume_ckpt_path: null
trainer:
  devices: 8
  num_nodes: 1
  max_epochs: 500
  precision: 32-true
  accumulate_grad_batches: 1
  num_sanity_val_steps: 0
data:
  sampler: dynamic
  num_workers: 8
  max_num_atoms: 200
  dynamic:
    scaling: square
    max_num_atoms_square: 3000000
    max_batch_size: 64
    skip_too_big: false
  sample_limit_dict:
    train: null
    val: 1000
model:
  training_args:
    lr_scheduler: af3
    max_lr: 0.0001
    lr_warmup_no_steps: 10000
  validation_args:
    sample_every_n_epochs: 10
    num_workers: 1
