# Standalone geometry module; CURRENT coordinates/cell, not reference conditions.
_target_: src.models.g1.geometry.PeriodicGeometry
cutoff: 0.6  # nm, independent of the chosen input length_unit
radial_sigma: 0.2  # on normalized squared distance q
delta: 0.1
max_images: 125  # maximum candidate box size per pair; never truncate
pair_chunk_size: 4096
bounds_margin: 1.0e-9
min_cell_singular_value: 1.0e-6  # nm, numerical safeguard
max_cell_condition: 1.0e6
length_unit: nm
angle_unit: radian
activation_checkpointing: false
