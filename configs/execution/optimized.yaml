# @package _global_
# Same architecture, FP32 training and original baseline TF32 policy.
# Only execution/operator, optimizer and data-loading implementations change.
# Compile is separately opt-in until measured on the actual dynamic shapes.
trainer:
  precision: 32-true
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    bucket_cap_mb: 25
    find_unused_parameters: false
model:
  flow_model_args:
    execution:
      pair_norm_reuse: true
      pair_bias_chunk_size: 4
      fused_pair_features: true
      packed_geometry: true
      joint_time_metrics: true
      # Additional sorting/host metadata cost: measure before enabling.
      bucket_geometry_images: false
      broadcast_masks: true
      defer_validation: true
      prepared_layouts: true
      cache_sampling_conditions: true
      fused_qkvg: true
      sdpa_backend: auto
      fold_readback: true
      geometry_layout_reuse: true
      vectorized_metrics: true
      avoid_repeat_copies: true
      compile_blocks: false
      compile_pair_features: false
      compile_backend: inductor
      compile_dynamic: true
  training_args:
    fused_adam: true
data:
  compact_batch: true
  prepare_g1_metadata: ${model.flow_model_args.g1.enabled}
  persistent_workers: true
  prefetch_factor: 2
